<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex, nofollow">
<title>Masthead compositor</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  /*
    Weekly hero artboard. 1200×480, device pixel ratio 1.
    Accent is parameterized. Dusty rose is the locked Signal default.
    Site coral #d9877c stays on the rest of gaiin.xyz — it is not used here.
  */
  :root {
    --signal-accent: #C9A79E;
    --navy: #0a1730;
    --headline: #dce7f2;
    --meta: #a8b8c8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1200px;
    height: 480px;
    overflow: hidden;
    background: var(--navy);
  }

  body {
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .masthead {
    position: relative;
    width: 1200px;
    height: 480px;
    overflow: hidden;
    background: var(--navy);
    padding: 20px 68px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Bottom to top: photo, homepage navy overlay, pattern3 mesh, then type.
     display:none until .has-photo — an unsourced img would paint a gray edge. */
  .photo,
  .overlay {
    display: none;
  }

  .masthead.has-photo .photo,
  .masthead.has-photo .overlay {
    display: block;
  }

  .photo {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 1200px;
    height: 480px;
    object-fit: cover;
    object-position: center center;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 0;
    /* Exact homepage hero overlay from index.html. */
    background-image: linear-gradient(rgba(13,41,81,.82), rgba(10,23,48,.93));
    pointer-events: none;
  }

  /* pattern3: light icons, navy field already transparent.
     Soften, and keep the left ~40% calmer than the right so type stays readable. */
  .mesh {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 1200px;
    height: 480px;
    object-fit: cover;
    object-position: center center;
    pointer-events: none;
    opacity: 0.9;
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.22) 40%, rgba(0,0,0,0.55) 68%, #000 100%);
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.22) 40%, rgba(0,0,0,0.55) 68%, #000 100%);
  }

  .brand,
  .copy,
  .foot {
    position: relative;
    z-index: 1;
  }

  .wordmark {
    display: block;
    width: 252px;
    height: auto;
    /* Primary lockup (clay letters, white name line). The SVG canvas has ~41/1698
       transparent padding; pull the ink flush with the type column. */
    margin: 10px 0 14px -6px;
  }

  .date {
    margin: 0;
    font-family: "Fragment Mono", ui-monospace, monospace;
    font-weight: 400;
    font-size: 13px;
    line-height: 1;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--signal-accent);
  }

  .copy {
    max-width: 980px;
  }

  .headline {
    margin: 0;
    max-width: 16.5em;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 400;
    font-size: 48px;
    line-height: 1.06;
    letter-spacing: -0.02em;
    color: var(--headline);
    text-wrap: pretty;
  }

  .hook {
    margin: 14px 0 0;
    font-family: "Libre Franklin", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.35;
    letter-spacing: 0;
    color: var(--signal-accent);
    white-space: nowrap;
  }

  .rule {
    height: 1px;
    width: 100%;
    background: var(--signal-accent);
  }

  .url {
    margin: 12px 0 0;
    font-family: "Fragment Mono", ui-monospace, monospace;
    font-weight: 400;
    font-size: 13px;
    line-height: 1;
    letter-spacing: 0.08em;
    color: var(--meta);
  }
</style>
</head>
<body>
<article class="masthead" id="masthead">
  <img class="photo" id="masthead-photo" alt="" width="1200" height="480" decoding="sync">
  <div class="overlay" id="masthead-overlay"></div>
  <img class="mesh" src="assets/overlay-pattern3.png" alt="" width="1376" height="768" decoding="sync" aria-hidden="true">

  <header class="brand">
    <img class="wordmark" src="assets/gaiin-lockup-clay-white-wide.svg" alt="GAIIN — Global Applied Intelligence &amp; Innovation Network" width="1698" height="532">
    <p class="date" data-field="issueDate"></p>
  </header>

  <div class="copy">
    <h1 class="headline" data-field="headline"></h1>
    <p class="hook" data-field="hook"></p>
  </div>

  <footer class="foot">
    <div class="rule"></div>
    <p class="url">gaiin.xyz</p>
  </footer>
</article>

<!--
  Fill API
  issueDate: DD MMM YYYY
  headline: Playfair line
  hook: one line
  photo: URL or repo-root path. Empty keeps the solid navy field.
  photoPosition: optional CSS object-position, e.g. "center 40%"
  Query params of the same names override this block.
  A present photo param replaces the JSON value, including when it is empty.
-->
<script type="application/json" id="masthead-fill">
{
  "issueDate": "12 OCT 2026",
  "headline": "Who pays when AI fails — and who owns the stack",
  "hook": "Liability rules, a robot R&D hub in Causeway Bay, and a Copenhagen data layer.",
  "photo": "signal/assets/signal-masthead-2026-10-12.jpg"
}
</script>
<script>
(function () {
  function resolvePhoto(value) {
    var v = String(value || "").trim();
    if (!v) return "";
    if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.slice(0, 2) === "//") return v;
    var rel = v.replace(/^\/+/, "");
    if (rel.indexOf("signal/") === 0) return rel.slice("signal/".length);
    return "../" + rel;
  }

  var fill = JSON.parse(document.getElementById("masthead-fill").textContent);
  var fields = ["issueDate", "headline", "hook"];
  var params = new URLSearchParams(window.location.search);
  fields.forEach(function (key) {
    if (params.has(key) && params.get(key) !== "") fill[key] = params.get(key);
  });
  fields.forEach(function (key) {
    document.querySelector("[data-field='" + key + "']").textContent = fill[key];
  });

  var photo = fill.photo || "";
  if (params.has("photo")) photo = params.get("photo") || "";
  var photoPosition = fill.photoPosition || "";
  if (params.has("photoPosition") && params.get("photoPosition") !== "") {
    photoPosition = params.get("photoPosition");
  }

  var resolved = resolvePhoto(photo);
  if (resolved) {
    var photoEl = document.getElementById("masthead-photo");
    if (photoPosition) photoEl.style.objectPosition = photoPosition;
    document.getElementById("masthead").classList.add("has-photo");
    photoEl.src = resolved;
  }

  document.documentElement.setAttribute("data-masthead-filled", "true");
})();
</script>
</body>
</html>
